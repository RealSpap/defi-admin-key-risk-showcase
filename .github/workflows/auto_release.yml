name: Auto Release

# Releases are created by hand only (Actions > Auto Release > Run workflow),
# so two pushes on the same day never produce two releases with one title.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Decide whether this push is a research pass
        id: gate
        run: |
          SUBJECT="$(git log -1 --format=%s)"
          AUTHOR_EMAIL="$(git log -1 --format=%ae)"
          SKIP=false

          # Badge-sync commits (scripts/sync_badges.py, run by
          # update_badges.yml) carry no research content: no release.
          if [ "$AUTHOR_EMAIL" = "badge-sync-bot@users.noreply.github.com" ]; then
            SKIP=true
          fi
          if printf '%s' "$SUBJECT" | grep -Eqi '^(chore|ci|bot|build)(\([^)]*\))?:'; then
            SKIP=true
          fi

          # Merge commits carry no research content of their own.
          if printf '%s' "$SUBJECT" | grep -Eqi '^merge (pull request|branch)'; then
            SKIP=true
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Build release title and body
        if: steps.gate.outputs.skip != 'true'
        id: build
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          DATE_UTC="$(date -u +%Y-%m-%d)"
          TAG="pass-${DATE_UTC}-${SHORT_SHA}"
          TITLE="Research update ${DATE_UTC}"

          # Neutral notes: the findings themselves live in README.md.
          BODY_FILE="${RUNNER_TEMP}/release_body.txt"
          printf 'Findings updated on %s. See README.md at commit %s.\n' \
            "$DATE_UTC" "$SHORT_SHA" > "$BODY_FILE"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REL_TAG: ${{ steps.build.outputs.tag }}
          REL_TITLE: ${{ steps.build.outputs.title }}
          REL_BODY_FILE: ${{ steps.build.outputs.body_file }}
          REL_TARGET: ${{ github.sha }}
        run: |
          if gh release view "$REL_TAG" >/dev/null 2>&1; then
            echo "Release $REL_TAG already exists for this commit, skipping."
            exit 0
          fi
          gh release create "$REL_TAG" \
            --title "$REL_TITLE" \
            --notes-file "$REL_BODY_FILE" \
            --target "$REL_TARGET"
