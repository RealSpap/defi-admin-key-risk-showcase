name: Watch

# Every day, re-read on-chain every admin key named in this README (watch/cases.json: the protocols' own contracts and
# the key holders already named in the write-up) and record the state of each run on the watch-data branch (the previous state is read from
# it at the start of the run; main receives no commit from this job). Read-only, standard library,
# no key. A change opens an issue in the private research repository, where the case is re-verified before this
# README is updated. Nothing about a move is published from here except the fact that something moved: the log and the commits stay neutral, the details go
# only to the private issue, and without that token the run fails (red, nothing recorded, so the alarm repeats the
# next day instead of being lost). While a move or a contradiction is being re-verified, the state of that run is not recorded either: the published
# state stays at the last run without a move, and the alarm repeats on each run until someone records the re-verified state by hand. The research itself is not here: this is the freshness check of what is published.
on:
  schedule:
    # GitHub started the scheduled runs of 17 to 23 November 8 to 12 hours after the time written here; the time is set 12 hours earlier so that a late start lands before the morning
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Refuse any case that is not in the public write-up
        run: |
          python3 - <<'PY'
          import json, sys
          bad = [c["id"] for c in json.load(open("watch/cases.json"))["cases"] if c.get("published") is not True]
          if bad: sys.exit("watch/cases.json holds cases not marked published: %s" % bad)
          PY
      - name: Read the previous state from the watch-data branch (main keeps none; a missing branch or file stops the run red, it never starts from nothing)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/read_watch_data.sh
      - name: Re-read every published authority and diff against the snapshot
        id: run
        run: |
          set +e
          python3 scripts/watch_admin_keys.py --registry watch/cases.json --out watch --published-only > "$RUNNER_TEMP/run.log" 2>&1
          c=$?; echo "code=$c" >> "$GITHUB_OUTPUT"
          # a public log: what moved is withheld (it goes to the private issue below). After a move or a contradiction the unmoved reads are withheld too: the lines that are absent would name the contract that moved.
          if [ "$c" = 2 ] || [ "$c" = 3 ]; then grep -vE '^(ok|MOVED|CONTRADICTS) ' "$RUNNER_TEMP/run.log"; else grep -vE '^(MOVED|CONTRADICTS) ' "$RUNNER_TEMP/run.log"; fi
          case "$c" in 0) echo "nothing moved";; 1) echo "::warning::a check was not read this run (RPC)";; 2) echo "::warning::a published read moved, details withheld until it is re-verified";; 3) echo "::error::the registry contradicts the chain, details withheld";; *) echo "::error::exit $c";; esac
          exit 0
      - name: Alarm (an issue in the private repository; without ISSUES_TOKEN the run fails and commits nothing)
        if: steps.run.outputs.code == '2' || steps.run.outputs.code == '3'
        env:
          GH_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          PRIVATE_REPO: RealSpap/defi-admin-key-risk
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::alarm raised but no ISSUES_TOKEN secret: nothing committed, details withheld; the next run raises it again"; exit 1; }
          if [ "${{ steps.run.outputs.code }}" = 3 ]; then printf '## The public registry contradicts the chain\n\n```\n%s\n```\n' "$(grep CONTRADICTS "$RUNNER_TEMP/run.log")" > body.md; else cp watch/drift.md body.md; fi
          gh label create "admin key moved" --repo "$PRIVATE_REPO" --color B60205 --description "A recorded admin authority changed on-chain, or the registry contradicts the chain" 2>/dev/null || true
          N=$(gh issue list --repo "$PRIVATE_REPO" --label "admin key moved" --state open --json number -q '.[0].number' || true)
          if [ -n "$N" ]; then gh issue comment "$N" --repo "$PRIVATE_REPO" --body-file body.md
          else gh issue create --repo "$PRIVATE_REPO" --title "Admin key moved, seen from the showcase ($(date -u +%Y-%m-%d))" --label "admin key moved" --body-file body.md; fi
      - name: "A published read moved, or the registry contradicts the chain: the published state stays at the last run without a move (details withheld until the case is re-verified by hand)"
        if: steps.run.outputs.code == '2' || steps.run.outputs.code == '3'
        run: echo "the state of this run is not recorded on watch-data until the case is re-verified; the next run compares with the last recorded state and raises the alarm again"
      - name: Record the two state files on the watch-data branch (the only copy; the branch is created by hand once, this step never creates it and stops red if it is missing)
        if: steps.run.outputs.code != '2' && steps.run.outputs.code != '3'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/publish_watch_data.sh
